name: Add screenshot section

on:
  push:
    paths:
      - .github/workflows/add-screenshot-section.yml

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add screenshot section to index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'class="screenshots"' in s:
              print('Screenshot section already exists; nothing to do.')
              raise SystemExit(0)

          for image in (
              'images/screenshots/viewer.png',
              'images/screenshots/admin-control.jpg',
              'images/screenshots/admin-viewers.jpg',
              'images/screenshots/admin-page.jpg',
          ):
              if not Path(image).is_file():
                  raise SystemExit(f'Missing screenshot: {image}')

          css_anchor = '''    .feature p {
            margin: 0;
            color: var(--muted);
            font-size: 15px;
          }

          '''

          css_insert = '''    .screenshots {
            padding: 0 0 120px;
          }

          .screenshots-intro {
            max-width: 760px;
            margin: -20px 0 32px;
            color: var(--muted);
          }

          .screenshot-main {
            margin: 0 0 16px;
          }

          .screenshot-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
          }

          .screenshot-grid .screenshot-card:last-child {
            grid-column: 1 / -1;
          }

          .screenshot-card {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(145deg, rgba(255, 255, 255, .055), rgba(255, 255, 255, .02));
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: 0 18px 55px rgba(0, 0, 0, .2);
          }

          .screenshot-link {
            position: relative;
            display: block;
            overflow: hidden;
            background: #05070b;
            border-bottom: 1px solid var(--line);
          }

          .screenshot-link::after {
            position: absolute;
            right: 14px;
            bottom: 14px;
            padding: 5px 9px;
            color: var(--text);
            background: rgba(8, 11, 18, .82);
            border: 1px solid rgba(255, 255, 255, .16);
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            content: "拡大 ↗";
            opacity: .82;
            backdrop-filter: blur(8px);
          }

          .screenshot-link img {
            display: block;
            width: 100%;
            height: auto;
            transition: transform .2s ease, opacity .2s ease;
          }

          .screenshot-link:hover img {
            opacity: .94;
            transform: scale(1.004);
          }

          .screenshot-caption {
            padding: 20px 22px 22px;
          }

          .screenshot-main .screenshot-caption,
          .screenshot-grid .screenshot-card:last-child .screenshot-caption {
            display: grid;
            grid-template-columns: minmax(170px, .36fr) 1fr;
            gap: 24px;
            align-items: start;
          }

          .screenshot-heading {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 7px;
          }

          .screenshot-type {
            display: inline-flex;
            padding: 3px 8px;
            color: var(--accent);
            background: rgba(103, 232, 194, .08);
            border: 1px solid rgba(103, 232, 194, .2);
            border-radius: 999px;
            font-size: 11px;
            font-weight: 750;
          }

          .screenshot-caption h3 {
            margin: 0;
            font-size: 20px;
          }

          .screenshot-caption p {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
          }

          '''

          media_old = '''      .feature-grid,
                .feedback-grid,
                .release-grid,
                .release-card-wide {
                  grid-template-columns: 1fr;
                }

                .features,
                .release,
                .feedback {
                  padding-bottom: 80px;
                }
          '''

          media_new = '''      .feature-grid,
                .feedback-grid,
                .release-grid,
                .release-card-wide,
                .screenshot-grid {
                  grid-template-columns: 1fr;
                }

                .screenshot-grid .screenshot-card:last-child {
                  grid-column: auto;
                }

                .screenshot-main .screenshot-caption,
                .screenshot-grid .screenshot-card:last-child .screenshot-caption {
                  grid-template-columns: 1fr;
                  gap: 10px;
                }

                .features,
                .release,
                .feedback,
                .screenshots {
                  padding-bottom: 80px;
                }
          '''

          html_anchor = '''      </section>

                <section class="release" id="latest-update">
          '''

          html_insert = '''      </section>

                <section class="screenshots" id="screenshots">
                  <p class="eyebrow">Screenshots</p>
                  <h2 class="section-title">実際の画面を見てみる。</h2>

                  <p class="screenshots-intro">
                    視聴者が使う配信ページと、配信者が使う管理画面です。
                    配信中の操作からコメント・リアクション・アンケートなどの設定まで、ブラウザ上でまとめて扱えます。
                    画像をクリックすると原寸で確認できます。
                  </p>

                  <figure class="screenshot-card screenshot-main">
                    <a class="screenshot-link" href="./images/screenshots/viewer.png" target="_blank" rel="noopener">
                      <img
                        src="./images/screenshots/viewer.png"
                        alt="チャット、リアクション、落書き機能を表示した自鯖配信キットの視聴ページ"
                        loading="lazy"
                      >
                    </a>
                    <figcaption class="screenshot-caption">
                      <div class="screenshot-heading">
                        <span class="screenshot-type">視聴者向け</span>
                        <h3>視聴ページ</h3>
                      </div>
                      <p>
                        チャット、画像・音声・動画リアクション、落書き、画質切替、スクリーンショット、
                        アーカイブなど、配信を見るための機能をひとつの画面にまとめています。
                      </p>
                    </figcaption>
                  </figure>

                  <div class="screenshot-grid">
                    <figure class="screenshot-card">
                      <a class="screenshot-link" href="./images/screenshots/admin-control.jpg" target="_blank" rel="noopener">
                        <img
                          src="./images/screenshots/admin-control.jpg"
                          alt="自鯖配信キットの配信操作管理画面"
                          loading="lazy"
                        >
                      </a>
                      <figcaption class="screenshot-caption">
                        <div class="screenshot-heading">
                          <span class="screenshot-type">管理者向け</span>
                          <h3>配信操作</h3>
                        </div>
                        <p>
                          配信状態や再生中の視聴数を確認しながら、タイトル・説明の簡易編集や、
                          落書き機能の切り替えなどを行えます。
                        </p>
                      </figcaption>
                    </figure>

                    <figure class="screenshot-card">
                      <a class="screenshot-link" href="./images/screenshots/admin-viewers.jpg" target="_blank" rel="noopener">
                        <img
                          src="./images/screenshots/admin-viewers.jpg"
                          alt="自鯖配信キットの視聴者設定管理画面"
                          loading="lazy"
                        >
                      </a>
                      <figcaption class="screenshot-caption">
                        <div class="screenshot-heading">
                          <span class="screenshot-type">管理者向け</span>
                          <h3>視聴者設定</h3>
                        </div>
                        <p>
                          接続人数の上限、コメント制限、アンケート、リアクションなど、
                          視聴者が利用できる機能をまとめて設定できます。
                        </p>
                      </figcaption>
                    </figure>

                    <figure class="screenshot-card">
                      <a class="screenshot-link" href="./images/screenshots/admin-page.jpg" target="_blank" rel="noopener">
                        <img
                          src="./images/screenshots/admin-page.jpg"
                          alt="自鯖配信キットの配信ページ設定管理画面"
                          loading="lazy"
                        >
                      </a>
                      <figcaption class="screenshot-caption">
                        <div class="screenshot-heading">
                          <span class="screenshot-type">管理者向け</span>
                          <h3>配信ページ設定</h3>
                        </div>
                        <p>
                          サイト名、配信タイトル、説明、サムネイル、オフライン画像、公開URLなど、
                          視聴ページの見た目と基本情報を管理できます。
                        </p>
                      </figcaption>
                    </figure>
                  </div>
                </section>

                <section class="release" id="latest-update">
          '''

          if css_anchor not in s:
              raise SystemExit('CSS anchor not found')
          if media_old not in s:
              raise SystemExit('Responsive CSS anchor not found')
          if html_anchor not in s:
              raise SystemExit('HTML anchor not found')

          s = s.replace(css_anchor, css_anchor + css_insert, 1)
          s = s.replace(media_old, media_new, 1)
          s = s.replace(html_anchor, html_insert, 1)

          for ref in (
              './images/screenshots/viewer.png',
              './images/screenshots/admin-control.jpg',
              './images/screenshots/admin-viewers.jpg',
              './images/screenshots/admin-page.jpg',
          ):
              if s.count(ref) != 2:
                  raise SystemExit(f'Unexpected image reference count for {ref}: {s.count(ref)}')

          if s.count('class="screenshots"') != 1:
              raise SystemExit('Screenshot section count is not 1')

          p.write_text(s, encoding='utf-8', newline='\n')
          print('index.html updated successfully')
          PY

      - name: Commit landing page update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add UI screenshots to landing page"
          git push origin HEAD:main
